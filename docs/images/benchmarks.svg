  <!-- Max = 266.9 ns -> bar track width = 220px -->
  <rect x="28" y="76" width="444" height="192" rx="10" class="panel"/>
  <text x="42" y="96" class="sans panel-title">Set (Single-Threaded Write)</text>
  <rect x="334" y="83" width="124" height="19" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="396" y="92.5" class="mono" font-size="9.5" font-weight="700" fill="#6EE7B7" text-anchor="middle" dominant-baseline="central">#1 Fastest • 0 allocs</text>

  <!-- Row 1: MemoryStore 54.8ns -> 45px -->
  <text x="42" y="122" class="mono" font-size="10.5" font-weight="700" fill="#7DD3FC" dominant-baseline="central">MemoryStore</text>
