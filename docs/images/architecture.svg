<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">MemoryStore Sharded Cache and Pluggable Pub/Sub Architecture</title>
  <desc id="desc">Architecture diagram of MemoryStore in Go 1.27 showing the zero-dependency core API with encoding/json/v2, hash/maphash routing across 256 64-byte cache-line padded inline shards with per-shard atomic counters and background TTL sweeping, and the pluggable PubSubClient layer supporting InMemoryPubSub, standalone pubsub/gcp (v2), and custom adapters.</desc>
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
      .title { font-size: 20px; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-size: 12px; font-weight: 400; fill: #94A3B8; }
      .panel { fill: #152033; stroke: #293548; stroke-width: 1.25; }
      .subcard { fill: #0F172A; stroke: #334155; stroke-width: 1.1; }
      .panel-title { font-size: 12.5px; font-weight: 700; fill: #F8FAFC; }
      .label { font-size: 11.5px; font-weight: 500; fill: #E2E8F0; }
      .muted { font-size: 10.5px; font-weight: 400; fill: #94A3B8; }
      .flow-cyan { stroke: #00ADD8; stroke-width: 1.75; fill: none; }
      .flow-blue { stroke: #60A5FA; stroke-width: 1.5; fill: none; }
      .flow-green { stroke: #10B981; stroke-width: 1.75; fill: none; }
      .flow-rose { stroke: #FB7185; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    </style>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#00ADD8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#60A5FA"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#FB7185"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="956" height="536" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="38" class="sans title">MemoryStore Architecture</text>
  <text x="28" y="57" class="sans subtitle">Zero-dependency Go 1.27 sharded cache: 256 64B shards, encoding/json/v2 &amp; pluggable Pub/Sub</text>

  <!-- Brand Badge Pill -->
  <rect x="708" y="21" width="224" height="36" rx="8" fill="#0B172A" stroke="#00ADD8" stroke-opacity="0.75" stroke-width="1.25"/>
  <!-- Sharded KV Icon -->
  <rect x="721" y="30" width="7" height="7" rx="1.5" fill="#00ADD8"/>
  <rect x="730" y="30" width="7" height="7" rx="1.5" fill="#38BDF8"/>
  <rect x="721" y="39" width="7" height="7" rx="1.5" fill="#60A5FA"/>
  <rect x="730" y="39" width="7" height="7" rx="1.5" fill="#34D399"/>
  <text x="745" y="39" class="mono" font-size="13.5" font-weight="700" fill="#38BDF8" dominant-baseline="central">MemoryStore</text>
  <line x1="844" y1="29" x2="844" y2="49" stroke="#334155" stroke-width="1.2"/>
  <text x="853" y="39" class="mono" font-size="11" font-weight="600" fill="#CBD5E1" dominant-baseline="central">Go 1.27</text>

  <!-- ==================== LEFT ARCHITECTURE COLUMN (x=28..648, w=620) ==================== -->

  <!-- Tier 1: Client API & Serialization -->
  <rect x="28" y="78" width="620" height="90" rx="10" class="panel"/>
  <rect x="40" y="88" width="38" height="20" rx="5" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1.2"/>
  <text x="59" y="98" class="mono" font-size="10.5" font-weight="700" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">API</text>
  <text x="86" y="98" class="sans panel-title" dominant-baseline="central">MemoryStore Public API</text>
  <text x="634" y="98" class="mono muted" text-anchor="end" dominant-baseline="central">thread-safe • Config.Logger (slog)</text>

  <!-- Tier 1 Inner Cards -->
  <!-- Card A: Raw & Batch -->
  <rect x="40" y="114" width="188" height="44" rx="7" class="subcard"/>
  <text x="50" y="130" class="sans label" font-weight="600" fill="#38BDF8">Raw &amp; Batch KV</text>
  <text x="50" y="147" class="mono muted" font-size="9.5">Set/Get • SetMulti/GetMulti</text>

  <!-- Card B: JSON v2 -->
  <rect x="238" y="114" width="204" height="44" rx="7" fill="#0B172A" stroke="#00ADD8" stroke-opacity="0.75" stroke-width="1.2"/>
  <text x="248" y="130" class="mono label" font-weight="700" fill="#7DD3FC">encoding/json/v2 &amp; Generics</text>
  <text x="248" y="147" class="mono muted" font-size="9.2">GetJSONAs[T] • GetOrLoadJSON</text>

  <!-- Card C: Pub/Sub API -->
  <rect x="452" y="114" width="184" height="44" rx="7" fill="#0B172A" stroke="#10B981" stroke-opacity="0.75" stroke-width="1.2"/>
  <text x="462" y="130" class="sans label" font-weight="600" fill="#34D399">Pub/Sub &amp; Context API</text>
  <text x="462" y="147" class="mono muted" font-size="9.5">Subscribe/Publish • *Context</text>

  <!-- Arrow: JSON v2 -> Raw KV -->
  <line x1="238" y1="136" x2="229" y2="136" class="flow-cyan"/>

  <!-- Tier 2: Sharded Storage Engine -->
  <rect x="28" y="186" width="620" height="154" rx="10" class="panel"/>
  <rect x="40" y="196" width="38" height="20" rx="5" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="59" y="206" class="mono" font-size="10.5" font-weight="700" fill="#93C5FD" text-anchor="middle" dominant-baseline="central">KV</text>
  <text x="86" y="206" class="sans panel-title" dominant-baseline="central">Sharded Storage Engine</text>

  <!-- Hash Router Pill -->
  <rect x="262" y="194" width="256" height="24" rx="6" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1.15"/>
  <text x="390" y="206" class="mono" font-size="10.5" font-weight="600" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">hash/maphash.String(seed, k) &amp; 255</text>

  <!-- Batch Stack Note -->
  <rect x="526" y="194" width="110" height="24" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="581" y="206" class="mono" font-size="9.5" fill="#CBD5E1" text-anchor="middle" dominant-baseline="central">stack buf ≤128</text>

  <!-- Router Fan-Out Arrows to Shards -->
  <path d="M 320 218 L 320 227 L 106 227 L 106 238" class="flow-blue" marker-end="url(#arrow-blue)"/>
  <path d="M 358 218 L 358 227 L 246 227 L 246 238" class="flow-blue" marker-end="url(#arrow-blue)"/>
  <path d="M 412 218 L 412 227 L 386 227 L 386 238" class="flow-blue" marker-end="url(#arrow-blue)"/>
  <path d="M 454 218 L 454 227 L 566 227 L 566 238" class="flow-blue" marker-end="url(#arrow-blue)"/>

  <!-- 256 Inline Shards Row -->
  <!-- Shard 0 -->
  <rect x="40" y="240" width="132" height="58" rx="7" class="subcard"/>
  <text x="50" y="255" class="mono" font-size="10.5" font-weight="700" fill="#93C5FD">shards[0]</text>
  <text x="162" y="255" class="mono" font-size="9" fill="#64748B" text-anchor="end">64B</text>
  <text x="50" y="271" class="mono muted">RWMutex • map</text>
  <text x="50" y="287" class="mono" font-size="9.5" fill="#34D399">atomic counters</text>

  <!-- Shard 1 -->
  <rect x="180" y="240" width="132" height="58" rx="7" class="subcard"/>
  <text x="190" y="255" class="mono" font-size="10.5" font-weight="700" fill="#93C5FD">shards[1]</text>
  <text x="302" y="255" class="mono" font-size="9" fill="#64748B" text-anchor="end">64B</text>
  <text x="190" y="271" class="mono muted">RWMutex • map</text>
  <text x="190" y="287" class="mono" font-size="9.5" fill="#34D399">atomic counters</text>

  <!-- Shard 2 -->
  <rect x="320" y="240" width="132" height="58" rx="7" class="subcard"/>
  <text x="330" y="255" class="mono" font-size="10.5" font-weight="700" fill="#93C5FD">shards[2]</text>
  <text x="442" y="255" class="mono" font-size="9" fill="#64748B" text-anchor="end">64B</text>
  <text x="330" y="271" class="mono muted">RWMutex • map</text>
  <text x="330" y="287" class="mono" font-size="9.5" fill="#34D399">atomic counters</text>

  <!-- Ellipsis -->
  <circle cx="468" cy="269" r="2.2" fill="#64748B"/>
  <circle cx="478" cy="269" r="2.2" fill="#64748B"/>
  <circle cx="488" cy="269" r="2.2" fill="#64748B"/>

  <!-- Shard 255 -->
  <rect x="500" y="240" width="136" height="58" rx="7" class="subcard"/>
  <text x="510" y="255" class="mono" font-size="10.5" font-weight="700" fill="#93C5FD">shards[255]</text>
  <text x="626" y="255" class="mono" font-size="9" fill="#64748B" text-anchor="end">64B</text>
  <text x="510" y="271" class="mono muted">RWMutex • map</text>
  <text x="510" y="287" class="mono" font-size="9.5" fill="#34D399">atomic counters</text>

  <!-- Background Expiration Sweeper Strip -->
  <rect x="40" y="308" width="596" height="22" rx="6" fill="#1E1324" stroke="#FB7185" stroke-opacity="0.5" stroke-width="1"/>
  <text x="52" y="319" class="mono" font-size="10" font-weight="600" fill="#FB7185" dominant-baseline="central">TTL Sweeper</text>
  <text x="132" y="319" class="sans muted" dominant-baseline="central">per-shard sweep (CleanupInterval, default 1m) • pointer-free monotonic int64 expiresAt</text>
  <line x1="106" y1="308" x2="106" y2="300" class="flow-rose" marker-end="url(#arrow-rose)"/>
  <line x1="386" y1="308" x2="386" y2="300" class="flow-rose" marker-end="url(#arrow-rose)"/>
  <line x1="566" y1="308" x2="566" y2="300" class="flow-rose" marker-end="url(#arrow-rose)"/>

  <!-- Tier 3: Pluggable Pub/Sub Layer -->
  <rect x="28" y="358" width="620" height="114" rx="10" class="panel"/>
  <rect x="40" y="368" width="38" height="20" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="59" y="378" class="mono" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="middle" dominant-baseline="central">PS</text>
  <text x="86" y="378" class="sans panel-title" dominant-baseline="central">Pluggable Pub/Sub Layer</text>
  <rect x="262" y="366" width="374" height="24" rx="6" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-opacity="0.7" stroke-width="1"/>
  <text x="449" y="378" class="mono" font-size="10" font-weight="600" fill="#6EE7B7" text-anchor="middle" dominant-baseline="central">PubSubClient interface (stdlib types only • Config.PubSub)</text>

  <!-- Pub/Sub Adapter Cards -->
  <!-- Default: InMemoryPubSub -->
  <rect x="40" y="398" width="206" height="62" rx="7" fill="#0B172A" stroke="#10B981" stroke-opacity="0.85" stroke-width="1.25"/>
  <text x="50" y="414" class="mono" font-size="11" font-weight="700" fill="#34D399">InMemoryPubSub</text>
  <rect x="186" y="403" width="50" height="15" rx="4" fill="#064E3B"/>
  <text x="211" y="411" class="mono" font-size="8.5" font-weight="700" fill="#6EE7B7" text-anchor="middle" dominant-baseline="central">DEFAULT</text>
  <text x="50" y="432" class="mono muted" font-size="9.5">exactSubs: O(1) lookup</text>
  <text x="50" y="448" class="mono muted" font-size="9.5">wildcardSubs: 0-alloc Cut</text>

  <!-- Standalone Cloud Sub-Modules -->
  <rect x="256" y="398" width="194" height="62" rx="7" class="subcard"/>
  <text x="266" y="414" class="mono" font-size="10.5" font-weight="700" fill="#38BDF8">pubsub/gcp &amp; azure</text>
  <rect x="384" y="403" width="56" height="15" rx="4" fill="#0C4A6E"/>
  <text x="412" y="411" class="mono" font-size="8.2" font-weight="600" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">SUB-MOD</text>
  <text x="266" y="432" class="mono muted" font-size="9.5">GCP Pub/Sub v2 • Service Bus</text>
  <text x="266" y="448" class="mono muted" font-size="9.5">isolated go.mod • auto-TTL</text>

  <!-- Custom Adapters -->
  <rect x="460" y="398" width="176" height="62" rx="7" fill="#0F172A" stroke="#475569" stroke-width="1.15" stroke-dasharray="4 3"/>
  <text x="470" y="414" class="sans" font-size="11.5" font-weight="700" fill="#E2E8F0">Custom Adapters</text>
  <text x="470" y="432" class="mono muted" font-size="9.5">Redis • NATS • Kafka</text>
  <text x="470" y="448" class="mono muted" font-size="9.5">implicit Go satisfaction</text>

  <!-- ==================== INTER-TIER FLOW ARROWS ==================== -->
  <!-- Raw KV -> Hash Router -->
  <path d="M 134 158 L 134 176 L 348 176 L 348 192" class="flow-cyan" marker-end="url(#arrow-cyan)"/>
  <!-- JSON v2 -> Hash Router -->
  <path d="M 340 158 L 340 176 L 390 176 L 390 192" class="flow-cyan" marker-end="url(#arrow-cyan)"/>
  <!-- Pub/Sub API -> Pub/Sub Layer (routed cleanly down right margin of left column) -->
  <path d="M 636 136 L 642 136 L 642 350 L 560 350 L 560 364" class="flow-green" marker-end="url(#arrow-green)"/>

  <!-- ==================== RIGHT ANNOTATION COLUMN (x=664..932, w=268) ==================== -->

  <!-- Card 1: Zero-Dependency Go 1.27 Core -->
  <rect x="664" y="78" width="268" height="90" rx="10" class="panel"/>
  <text x="680" y="99" class="sans panel-title" fill="#38BDF8">1. Zero-Dependency Core</text>
  <text x="680" y="119" class="mono label">go.mod: <tspan fill="#34D399">0 external deps</tspan></text>
  <text x="680" y="137" class="mono muted">encoding/json/v2 • hash/maphash</text>
  <text x="680" y="155" class="mono muted">Green Tea GC • &lt;80B fast malloc</text>

  <!-- Card 2: 64-Byte Cache-Line Shard Layout -->
  <rect x="664" y="186" width="268" height="154" rx="10" class="panel"/>
  <text x="680" y="207" class="sans panel-title" fill="#60A5FA">2. shard Struct (64B Aligned)</text>
  <rect x="680" y="218" width="236" height="22" rx="5" fill="#0F172A" stroke="#334155"/>
  <text x="690" y="229" class="mono" font-size="10.2" fill="#E2E8F0" dominant-baseline="central">mu: sync.RWMutex</text>
  <text x="906" y="229" class="mono" font-size="9.5" fill="#64748B" text-anchor="end" dominant-baseline="central">24B</text>
  <rect x="680" y="244" width="236" height="22" rx="5" fill="#0F172A" stroke="#334155"/>
  <text x="690" y="255" class="mono" font-size="10.2" fill="#93C5FD" dominant-baseline="central">store: map[string]item</text>
  <text x="906" y="255" class="mono" font-size="9.5" fill="#64748B" text-anchor="end" dominant-baseline="central">8B</text>
  <rect x="680" y="270" width="236" height="22" rx="5" fill="#0F172A" stroke="#334155"/>
  <text x="690" y="281" class="mono" font-size="10.2" fill="#34D399" dominant-baseline="central">hits/misses/evictions</text>
  <text x="906" y="281" class="mono" font-size="9.5" fill="#64748B" text-anchor="end" dominant-baseline="central">24B</text>
  <rect x="680" y="296" width="236" height="20" rx="5" fill="#0B172A" stroke="#334155"/>
  <text x="690" y="306" class="mono" font-size="10" fill="#FBBF24" dominant-baseline="central">bytes: int64 (MaxBytes)</text>
  <text x="906" y="306" class="mono" font-size="9.5" fill="#64748B" text-anchor="end" dominant-baseline="central">8B</text>
  <text x="680" y="330" class="mono muted">item: []byte + int64 expiresAt (32B)</text>

  <!-- Card 3: Verified Performance -->
  <rect x="664" y="358" width="268" height="114" rx="10" class="panel"/>
  <text x="680" y="379" class="sans panel-title" fill="#34D399">3. Benchmarked Performance</text>
  <text x="680" y="400" class="mono label">GetParallel: <tspan fill="#38BDF8">7.88 ns/op</tspan></text>
  <text x="680" y="418" class="mono label">SetMulti(100): <tspan fill="#34D399">3.15 µs • 0 B</tspan></text>
  <text x="680" y="436" class="mono label">PubSub Exact: <tspan fill="#34D399">38.6 ns • 0 B</tspan></text>
  <text x="680" y="456" class="mono muted">99.1% cov • -race • goroutineleak</text>

  <!-- ==================== FOOTER LEGEND BAR ==================== -->
  <rect x="28" y="484" width="904" height="34" rx="8" class="panel"/>

  <line x1="44" y1="501" x2="70" y2="501" stroke="#00ADD8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="78" y="501" class="sans label" dominant-baseline="central">KV / JSON v2 Flow</text>

  <rect x="210" y="494" width="14" height="14" rx="3" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="232" y="501" class="sans label" dominant-baseline="central">256 Inline Shards (64B)</text>

  <line x1="398" y1="501" x2="424" y2="501" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="432" y="501" class="sans label" dominant-baseline="central">Pluggable Pub/Sub</text>

  <line x1="572" y1="501" x2="598" y2="501" stroke="#FB7185" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="606" y="501" class="sans label" dominant-baseline="central">Async TTL Eviction</text>

  <rect x="772" y="491" width="146" height="20" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="845" y="501" class="mono" font-size="10.5" font-weight="600" fill="#6EE7B7" text-anchor="middle" dominant-baseline="central">Zero-Dep Core</text>
</svg>
