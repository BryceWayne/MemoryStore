name: Go

on:
  push:
    branches: [ "root" ]
  pull_request:
    branches: [ "root" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Get and verify dependencies
        run: |
          go mod download
          go mod verify
          (cd pubsub/gcp && go mod download && go mod verify)
          (cd pubsub/azure && go mod download && go mod verify)
          (cd pubsub/redis && go mod download && go mod verify)
          (cd pubsub/nats && go mod download && go mod verify)
          (cd pubsub/aws && go mod download && go mod verify)
          (cd pubsub/kafka && go mod download && go mod verify)
          (cd metrics/otel && go mod download && go mod verify)
          (cd metrics/prometheus && go mod download && go mod verify)
          (cd benchmarks && go mod download && go mod verify)
          (cd e2e && go mod download && go mod verify)

      - name: Verify formatting
        run: |
          "$(go env GOROOT)/bin/gofmt" -l . > gofmt_diff.txt
          if [ -s gofmt_diff.txt ]; then
            echo "Run 'make fmt' to fix formatting"
            cat gofmt_diff.txt
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          (cd pubsub/gcp && go vet ./...)
          (cd pubsub/azure && go vet ./...)
          (cd pubsub/redis && go vet ./...)
          (cd pubsub/nats && go vet ./...)
          (cd pubsub/aws && go vet ./...)
          (cd pubsub/kafka && go vet ./...)
          (cd metrics/otel && go vet ./...)
          (cd metrics/prometheus && go vet ./...)
          (cd benchmarks && go vet ./...)
          (cd e2e && go vet ./...)

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.15.0

      - name: Run golangci-lint
        run: |
          golangci-lint run ./...
          (cd pubsub/gcp && golangci-lint run --config ../../.golangci.yml ./...)
          (cd pubsub/azure && golangci-lint run --config ../../.golangci.yml ./...)
          (cd pubsub/redis && golangci-lint run --config ../../.golangci.yml ./...)
          (cd pubsub/nats && golangci-lint run --config ../../.golangci.yml ./...)
          (cd pubsub/aws && golangci-lint run --config ../../.golangci.yml ./...)
          (cd pubsub/kafka && golangci-lint run --config ../../.golangci.yml ./...)
          (cd metrics/otel && golangci-lint run --config ../../.golangci.yml ./...)
          (cd metrics/prometheus && golangci-lint run --config ../../.golangci.yml ./...)
          (cd benchmarks && golangci-lint run --config ../.golangci.yml ./...)
          (cd e2e && golangci-lint run --config ../.golangci.yml ./...)

      - name: Build
        run: |
          go build -v ./...
          (cd pubsub/gcp && go build -v ./...)
          (cd pubsub/azure && go build -v ./...)
          (cd pubsub/redis && go build -v ./...)
          (cd pubsub/nats && go build -v ./...)
          (cd pubsub/aws && go build -v ./...)
          (cd pubsub/kafka && go build -v ./...)
          (cd pubsub/kafka && CGO_ENABLED=0 go build -v ./...)
          (cd metrics/otel && go build -v ./...)
          (cd metrics/prometheus && go build -v ./...)
          (cd benchmarks && go test -c -o /dev/null .)
          (cd e2e && go test -c -o /dev/null .)

      - name: Test with Race Detector and Coverage
        run: |
          go test -count=1 -race -coverprofile=coverage.out -covermode=atomic -v ./...
          (cd pubsub/gcp && go test -count=1 -race -cover -v ./...)
          (cd pubsub/azure && go test -count=1 -race -cover -v ./...)
          (cd pubsub/redis && go test -count=1 -race -cover -v ./...)
          (cd pubsub/nats && go test -count=1 -race -cover -v ./...)
          (cd pubsub/aws && go test -count=1 -race -cover -v ./...)
          (cd pubsub/kafka && go test -count=1 -race -cover -v ./...)
          (cd metrics/otel && go test -count=1 -race -cover -v ./...)
          (cd metrics/prometheus && go test -count=1 -race -cover -v ./...)
          (cd benchmarks && go test -count=1 -race -v ./...)
          (cd e2e && go test -count=1 -race -v ./...)

      - name: Fuzz smoke tests
        run: |
          go test -run='^$' -fuzz='^FuzzMatchesTopic$' -fuzztime=5s ./memorystore
          go test -run='^$' -fuzz='^FuzzInvalidationUnmarshal$' -fuzztime=5s ./memorystore
          go test -run='^$' -fuzz='^FuzzSnapshotLoad$' -fuzztime=5s ./memorystore
          (cd pubsub/aws && go test -run='^$' -fuzz='^FuzzAWSExtractPayload$' -fuzztime=5s .)

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # optional, but required for private repos
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
