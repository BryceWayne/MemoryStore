    open-pull-requests-limit: 5

  - package-ecosystem: "gomod"
    directory: "/pubsub/gcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "pubsub"

  - package-ecosystem: "gomod"
    directory: "/pubsub/azure"
