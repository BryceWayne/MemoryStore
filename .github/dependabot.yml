    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "pubsub"

  - package-ecosystem: "gomod"
    directory: "/pubsub/nats"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "pubsub"

  - package-ecosystem: "gomod"
    directory: "/pubsub/aws"
